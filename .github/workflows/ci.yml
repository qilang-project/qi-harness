name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚠ 用到 qi-web 的**新 API** 时必须一起 bump 这个钉子。
  # 钉住是对的（CI 要可复现），但漏 bump 是**静默**的：本地跑得好好的，
  # CI 上报 `导入的符号「X」不存在` —— 因为那边 checkout 的是老版本。
  # 观测指标.qi 用 Web.指标 时踩过一次：钉的 120576d 早于整个指标模块。
  QI_WEB_REF: ce83ee311c60b22d4056529ecb730ccc7db94686
  QI_CLI_REF: 903ecd28eb97967d856eb88867046388f9d04cbb
  QI_GRAPH_REF: 53c8ef9cf3da87f7f175abc82821997d5011514c
  QI_KV_REF: 0f4ae81a67ee4888af22ab9bc5623c325cbc60b6
  QI_SOURCE_REF: d82fe23f269d4392b74daed863f5a572ee0385cb
  QI_RUNTIME_SOURCE_REF: ba333ad43161f8f7fbac62a849718d593f71653a
  QI_GUI_SOURCE_REF: 493c6ebad80925735e538c621e639948e9698969

jobs:
  quality:
    name: Quality gate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # 钉的 qi 源码用 inkwell/llvm-sys-211，要 LLVM 21。runner 上没有，
      # 报的是 `No suitable version of LLVM was found system-wide or pointed
      # to by LLVM_SYS_211_PREFIX` —— 这一步以前压根没有，所以从来没走到过。
      # 与 qi 仓自己的 CI 保持一致。
      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lsb-release wget \
            software-properties-common gnupg libssl-dev libsqlite3-dev pkg-config
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libpolly-21-dev libzstd-dev libxml2-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
          # qi 生成的是不透明指针(ptr) IR：另装 clang-17 专供编译 .ll，
          # 与构建 qi 用的 LLVM 21 是两回事。
          sudo ./llvm.sh 17
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 200

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> $GITHUB_ENV

      - name: Build pinned Qi source
        shell: bash
        run: |
          set -euo pipefail
          prefix="$("$GITHUB_WORKSPACE/scripts/install-qi-source.sh")"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Bootstrap Qi package siblings
        shell: bash
        run: |
          set -euo pipefail
          # ⚠ 必须放在**项目目录里的 qi_packages/**，不能只靠 QI_PACKAGES_PATH。
          # qi.toml 里 [依赖] 声明了的包（Web / Graph），2026.09.12-2 起编译器只认
          # 项目自己的 qi_packages/<名>（也就是 `qi 包 安装` 会放的位置），找不到
          # 直接报「注册中心依赖 尚未安装」，不再退到 QI_PACKAGES_PATH 去碰运气 ——
          # 那是 qi 2.0 删掉祖先扫描时一并删掉的静默兜底。本地之所以一直好好的，
          # 是 monorepo 根上的 qi工作区.toml [覆盖] 把它们指去了隔壁目录。
          packages="${GITHUB_WORKSPACE}/qi_packages"
          mkdir -p "$packages"
          clone_at() {   # 名 仓库 SHA
            git clone --quiet "https://github.com/qilang-project/$2.git" "$packages/$1"
            git -C "$packages/$1" checkout --quiet "$3"
          }
          clone_at Web qi-web "$QI_WEB_REF"
          # qi-cli：cmd/qi-harness.qi（开发者 CLI）要导 CLI 包（[开发依赖]）。
          clone_at CLI qi-cli "$QI_CLI_REF"
          # 图记忆 依赖 qi-graph(Graph) → qi-kv(KV)。不装的话 graph memory 套件只会
          # 自己跳过 —— 装上它才真的被测到。
          clone_at Graph qi-graph "$QI_GRAPH_REF"
          clone_at KV qi-kv "$QI_KV_REF"
          # 兼容：未声明成依赖、按名字找包的那一路仍走 QI_PACKAGES_PATH
          echo "QI_PACKAGES_PATH=$packages" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: python3 "$GITHUB_WORKSPACE/scripts/check-qi-compat.py"

      # Keep CI and local release validation on the same entry point.
      - name: Run full quality gate
        env:
          QI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        working-directory: ${{ runner.temp }}
        run: "$GITHUB_WORKSPACE/run-offline-tests.sh"
